launch_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    app_id:
      required: true
      example: "111299001912"
      selector:
        text:

close_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    app_id:
      required: true
      example: "111299001912"
      selector:
        text:

install_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    path:
      required: false
      example: "samstream/Samstream.wgt"
      selector:
        text:

play_stream:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    camera:
      selector:
        entity:
          domain: camera
    label:
      example: "Front door"
      selector:
        text:
    message:
      example: "Someone is at the door"
      selector:
        text:
          multiline: true
    duration:
      example: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    return_to_previous:
      default: true
      selector:
        boolean:
    pip:
      default: false
      selector:
        boolean:
    url:
      advanced: true
      example: "rtsp://user:pass@192.168.1.6:554/Streaming/channels/101"
      selector:
        text:

show_message:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    title:
      example: "Front door"
      selector:
        text:
    message:
      example: "Someone is at the door"
      selector:
        text:
          multiline: true
    severity:
      default: info
      selector:
        select:
          translation_key: severity
          options:
            - info
            - warning
            - alert
    sound:
      selector:
        media:
          accept:
            - audio/*
    duration:
      example: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    return_to_previous:
      default: true
      selector:
        boolean:

update_message:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    message:
      required: true
      example: "A courier is holding a parcel"
      selector:
        text:
          multiline: true

stop_stream:
  target:
    entity:
      integration: samstream
      domain: media_player
