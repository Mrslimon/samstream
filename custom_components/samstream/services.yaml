launch_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    app_id:
      required: true
      example: "111299001912"
      selector:
        text:

close_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    app_id:
      required: true
      example: "111299001912"
      selector:
        text:

install_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    path:
      required: false
      example: "samstream/Samstream.wgt"
      selector:
        text:

uninstall_app:
  target:
    entity:
      integration: samstream
      domain: media_player

select_art:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    content_id:
      required: true
      example: "MY_F0003"
      selector:
        text:
    matte:
      required: false
      example: "shadowbox_sand"
      selector:
        text:

list_art:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    category:
      required: false
      example: "MY-C0002"
      selector:
        text:

upload_art:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    path:
      required: true
      example: "art/sunset.jpg"
      selector:
        text:
    show:
      required: false
      default: false
      selector:
        boolean:

play_stream:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    camera:
      selector:
        entity:
          domain: camera
    label:
      example: "Front door"
      selector:
        text:
    message:
      example: "Someone is at the door"
      selector:
        text:
          multiline: true
    duration:
      example: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    return_to_previous:
      default: true
      selector:
        boolean:
    tv_corner:
      default: "off"
      selector:
        select:
          translation_key: tv_corner
          options:
            - "off"
            - "on"
            - top_left
            - top_right
            - bottom_left
            - bottom_right
    url:
      advanced: true
      example: "rtsp://user:pass@192.168.1.6:554/Streaming/channels/101"
      selector:
        text:

show_message:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    title:
      example: "Front door"
      selector:
        text:
    message:
      example: "Someone is at the door"
      selector:
        text:
          multiline: true
    severity:
      default: info
      selector:
        select:
          translation_key: severity
          options:
            - info
            - warning
            - alert
            - success
    sound:
      selector:
        media:
          accept:
            - audio/*
    duration:
      example: 30
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: s
          mode: box
    return_to_previous:
      default: true
      selector:
        boolean:

update_message:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    message:
      required: true
      example: "A courier is holding a parcel"
      selector:
        text:
          multiline: true

send_keys:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    keys:
      required: true
      example: '["KEY_HOME", "KEY_DOWN", "KEY_ENTER"]'
      selector:
        text:
          multiple: true
    repeats:
      default: 1
      selector:
        number:
          min: 1
          max: 50
          mode: box
    delay:
      default: 0.4
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: s
          mode: box
    hold:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box

send_text:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    text:
      required: true
      example: "Breaking Bad"
      selector:
        text:
    done:
      default: true
      selector:
        boolean:

hold_key:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    key:
      required: true
      example: KEY_ENTER
      selector:
        text:
    seconds:
      default: 1.5
      selector:
        number:
          min: 0.1
          max: 30
          step: 0.1
          unit_of_measurement: s
          mode: box

pointer:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    move_x:
      default: 0
      selector:
        number:
          min: -1920
          max: 1920
          mode: box
    move_y:
      default: 0
      selector:
        number:
          min: -1080
          max: 1080
          mode: box
    click:
      selector:
        select:
          translation_key: click
          options:
            - left
            - right

stop_stream:
  target:
    entity:
      integration: samstream
      domain: media_player

art_mode:
  target:
    entity:
      integration: samstream
      domain: media_player

open_url:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    url:
      required: true
      example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      selector:
        text:

local_control_request:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    method:
      required: true
      default: get
      selector:
        select:
          options:
            - get
            - post
            - push
            - reply
    resource:
      required: true
      example: "/sec/tv/display/orientation"
      selector:
        text:
    body:
      required: false
      example: '{"x.com.samsung.tv.currentMode": "HDMI1"}'
      selector:
        object:
