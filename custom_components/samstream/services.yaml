launch_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    app_id:
      required: true
      example: "111299001912"
      selector:
        text:

close_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    app_id:
      required: true
      example: "111299001912"
      selector:
        text:

install_app:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    path:
      required: false
      example: "samstream/Samstream.wgt"
      selector:
        text:

play_stream:
  target:
    entity:
      integration: samstream
      domain: media_player
  fields:
    camera:
      selector:
        entity:
          domain: camera
    label:
      example: "Front door"
      selector:
        text:
    message:
      example: "Someone is at the door"
      selector:
        text:
          multiline: true
    url:
      advanced: true
      example: "rtsp://user:pass@192.168.1.6:554/Streaming/channels/101"
      selector:
        text:

stop_stream:
  target:
    entity:
      integration: samstream
      domain: media_player
