<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Samstream</title>
    <!-- Samsung Product API (AVPlay); resolved by the TV at runtime, not bundled -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
  </head>
  <body>
    <!-- AVPlay renders on the video plane behind the transparent HTML layer -->
    <object id="av-player" type="application/avplayer"></object>
    <!-- go2rtc MSE streams render here instead of the AVPlay plane -->
    <video id="mse-video" muted playsinline></video>
    <!-- Corner mode: the camera as pictures, leaving the video layer to the TV -->
    <img id="mjpeg-image" alt="" />

    <main id="home">
      <section class="card hero">
        <div class="hero-text">
          <p class="eyebrow" id="version"></p>
          <h1 id="app-name">Samstream</h1>
          <p class="status"><span class="dot" id="status-dot"></span><span id="status-text"></span></p>
        </div>
        <div class="preview" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="120" height="120">
            <rect x="6" y="18" width="38" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="4" />
            <path d="M44 28 58 20v24l-14-8z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
          </svg>
          <p id="preview-text"></p>
        </div>
      </section>

      <section class="card info">
        <h2 id="info-title"></h2>
        <p id="info-text"></p>
      </section>

      <nav class="action-bar">
        <button type="button" class="primary" id="play-button"></button>
        <button type="button" class="secondary" id="help-button"></button>
        <button type="button" class="secondary" id="exit-button"></button>
      </nav>
    </main>

    <section id="player" hidden>
      <div class="hud" id="hud">
        <span class="live" id="live"></span>
        <span class="hud-label" id="hud-label" dir="auto"></span>
        <span class="hud-clock" id="hud-clock"></span>
      </div>
      <!-- Outline of the TV's own picture (Live TV / HDMI) shown in a corner -->
      <div class="tv-frame" id="tv-frame" hidden></div>
      <div class="chip" id="toast" hidden></div>
      <div id="overlay" aria-live="polite" hidden></div>
    </section>

    <section id="notice" hidden>
      <span class="notice-clock" id="notice-clock"></span>
      <div class="notice-card">
        <div class="notice-icon" id="notice-icon"></div>
        <h1 id="notice-title" dir="auto"></h1>
        <div class="notice-body" id="notice-body"></div>
      </div>
    </section>
    <audio id="sound"></audio>

    <section id="media" hidden>
      <video id="media-video" playsinline></video>
      <div class="media-note" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="140" height="140">
          <path d="M24 46V14l28-6v32" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" />
          <circle cx="17" cy="46" r="7" fill="none" stroke="currentColor" stroke-width="4" />
          <circle cx="45" cy="40" r="7" fill="none" stroke="currentColor" stroke-width="4" />
        </svg>
      </div>
      <div class="hud media-hud" id="media-hud"><span id="media-title" dir="auto"></span></div>
      <div class="media-progress"><div id="media-bar"></div></div>
    </section>

    <aside id="help" class="card" hidden></aside>
    <pre id="debug" dir="ltr" hidden></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
