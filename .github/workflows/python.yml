name: Python

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy lib/aiosamstream/src custom_components/samstream
      - run: uv run pytest --cov=aiosamstream --cov=custom_components.samstream --cov-report=term-missing
