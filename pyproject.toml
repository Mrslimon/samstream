[project]
name = "samstream-dev"
version = "0.0.0"
description = "Development workspace for the Samstream Home Assistant integration"
requires-python = ">=3.14.2"
dependencies = ["aiosamstream"]

[tool.uv]
package = false

[tool.uv.sources]
aiosamstream = { workspace = true }

[tool.uv.workspace]
members = ["lib/aiosamstream"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.14",
]
# Home Assistant test harness; does not install on native Windows, use WSL/Linux/CI.
ha = [
    "pytest-homeassistant-custom-component==0.13.373",
    # voice.py imports homeassistant.components.conversation; HA installs its
    # deps on demand (from the component's own manifest.json) rather than
    # declaring them on the homeassistant package, so a bare install of
    # homeassistant + pytest-homeassistant-custom-component never pulls these
    # in - only the full HA Docker image (which scripts/ha_dev.py test uses)
    # has them pre-installed. Pins match the conversation component's own
    # manifest.json for the homeassistant version this pins to.
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    # Same story for homeassistant.components.camera (media_player.py).
    "pyturbojpeg==1.8.3",
    # ...and the frontend component (required by manifest.json) and go2rtc
    # (stream_relay.py's after_dependency).
    "home-assistant-frontend==20260930.4",
    "go2rtc-client==0.4.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

# Shipped to users' computers in the LAN onboarding helper (onboard_tool.py):
# keep them runnable on Python 3.11+ (e.g. no unparenthesized `except A, B:`).
[tool.ruff.per-file-target-version]
"lib/aiosamstream/src/aiosamstream/exceptions.py" = "py311"
"lib/aiosamstream/src/aiosamstream/ocf/{cbor,coap_tcp,dtls,onboard,onboard_cli}.py" = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with formatter
    "CPY001", # no per-file copyright headers
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ISC001", # conflicts with formatter
    "S105",   # CONF_* key names are not secrets
    "TC001",  # HA idiom: runtime imports for annotations
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN401", "S106", "FBT003", "RUF012", "ARG001"]
"lib/aiosamstream/tests/**" = ["S101", "D", "PLR2004", "ANN401", "S106", "FBT001", "FBT003", "RUF012", "ARG002", "INP001"]  # plain dir: only tests/ is a package
"lib/aiosamstream/src/aiosamstream/__main__.py" = ["T201"]  # CLI output
"lib/aiosamstream/src/aiosamstream/ocf/onboard_cli.py" = ["T201"]  # CLI output
"lib/aiosamstream/src/aiosamstream/ocf/**" = ["ANN401"]  # CBOR bodies are dynamic data
"custom_components/**" = ["ARG001", "ARG002", "ARG004", "ANN401"]  # HA-defined signatures
"scripts/**" = ["T201", "D101", "D102", "D103", "D107", "D401", "ANN401", "PLR0913", "PLR0917", "INP001", "S603", "S607", "S310", "PLR2004", "PTH111", "E501"]  # dev tooling

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
mypy_path = "lib/aiosamstream/src"

# Type-check against HA, but do not report HA's own internals.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["lib/aiosamstream/tests", "tests"]
# Two packages are named `tests` (library and integration).
addopts = "--import-mode=importlib"
pythonpath = ["."]
# Provided by pytest-socket inside the HA test harness; declared for plain runs.
markers = ["enable_socket: allow real sockets in this test"]

[tool.coverage.run]
# Developer CLI, exercised by hand against a real TV.
omit = ["*/aiosamstream/__main__.py"]
