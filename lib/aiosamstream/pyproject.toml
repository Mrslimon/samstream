[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aiosamstream"
version = "0.2.1"
description = "Async client for Samsung Tizen TVs: control, sdb sideloading and the Samstream player app"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14.2"
authors = [{ name = "Islam Ahmady" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.12",
    "cryptography>=43",  # sdb RSA handshake; already in Home Assistant
    "samsungtvws[async]>=2.7.2,<4",  # HA core samsungtv pins 2.7.2
    "websockets>=15",
    # samsungtvws 2.7.x imports it without declaring it
    "async-timeout>=4",
]

[project.urls]
Source = "https://github.com/Mrslimon/samstream"

[tool.hatch.build.targets.wheel]
packages = ["src/aiosamstream"]
